    <div class="auth-container">
    <div class="panel left-panel">
        <h2>Login</h2>
        
        <form action="#" onsubmit="goToDashboard(event)">
            <div class="input-group">
                <i class="far fa-envelope"></i>
                <input type="text" placeholder="Username" required />
            </div>
            
    
            <div class="input-group" style="position: relative;">
                <i class="fas fa-lock"></i>
                <input type="password" id="passInput" placeholder="Password" required />
                <!-- Eye Icon-->
                <i class="far fa-eye" id="togglePassword" style="position: absolute; right: 15px; cursor: pointer; color: #a3a3a3;"></i>
            </div>

            <div class="form-extras" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 10px 0 20px 0;">
                <!-- Replaced with custom-checkbox structure -->
                <label class="custom-checkbox" style="padding: 0; font-size: 14px;">
                    <input type="checkbox">
                    <span class="checkmark"></span>
                    Remember me
                </label>
                
                <a href="#" style="color: rgb(0, 0, 122); text-decoration: none; font-size: 14px;">Forgot Password?</a>
            </div>

            <!-- Data Regulation Compliance -->
            <div class="privacy-consent" style="margin-bottom: 25px; text-align: left; width: 100%;">
                <label class="custom-checkbox" style="padding: 0; font-size: 12px; line-height: 1.4; align-items: flex-start;">
                    <input type="checkbox" required>
                    <span class="checkmark" style="min-width: 24px; margin-top: -2px;"></span> 
                    I agree to the processing of my personal data in accordance with PDPA/GDPR regulations.
                </label>
            </div>
            
            <!-- submit -->
            <button type="submit" class="solid-btn">LOGIN</button>
        </form>
    </div>
</div>
